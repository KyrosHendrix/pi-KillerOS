name: Tested tree
description: >-
  Checks for a successful pull request run that recorded the exact tree of this push to main.

outputs:
  skip:
    description: "'true' when the pushed files already passed the full workflow on their pull request."
    value: ${{ steps.lookup.outputs.skip }}

runs:
  using: composite
  steps:
    - id: lookup
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        skip=false
        repo="repos/$GITHUB_REPOSITORY"
        if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]] &&
          tree=$(git rev-parse --verify 'HEAD^{tree}') &&
          head=$(git rev-parse --verify -q HEAD^2) &&
          pr=$(gh api "$repo/commits/$GITHUB_SHA/pulls" -q "[.[] | select(.merged_at != null and .merge_commit_sha == \"$GITHUB_SHA\" and .base.ref == \"main\" and .head.sha == \"$head\")] | .[0].number // empty") &&
          [[ "$pr" =~ ^[0-9]+$ ]] &&
          runs=$(gh api "$repo/actions/workflows/ci.yml/runs?head_sha=$head&event=pull_request&status=success&per_page=5" -q '.workflow_runs[] | [.id, .run_attempt] | @tsv'); then
          while IFS=$'\t' read -r run attempt; do
            [[ "$run" =~ ^[0-9]+$ && "$attempt" =~ ^[0-9]+$ ]] || continue
            name="tested-tree-$pr-$attempt-$tree"
            if recorded=$(gh api "$repo/actions/runs/$run/artifacts?name=$name" -q "any(.artifacts[]; .name == \"$name\" and .expired == false)") &&
              [[ "$recorded" == true ]]; then
              skip=true
              echo "Pull request #$pr already tested tree $tree in CI run $run, attempt $attempt."
              break
            fi
          done <<< "$runs"
        fi
        echo "skip=$skip" >> "$GITHUB_OUTPUT"
        echo "Files already tested on their pull request: $skip"
