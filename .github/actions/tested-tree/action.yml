name: Tested tree
description: >-
  Reports whether this push to main is a pull request merge whose files already passed this workflow on
  that pull request, so the caller can skip repeating the work.

# Branch protection requires a pull request to contain the latest main before it merges. A merge commit
# then has exactly its second parent's files, and the pull request's own run already tested those files
# merged with main. Any lookup that fails or does not match leaves skip false, and the caller runs
# everything. Scheduled and manually started runs never skip.
outputs:
  skip:
    description: "'true' when the pushed files already passed the full workflow on their pull request."
    value: ${{ steps.lookup.outputs.skip }}

runs:
  using: composite
  steps:
    - id: lookup
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        skip=false
        if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then
          repo="repos/$GITHUB_REPOSITORY"
          head=$(gh api "$repo/git/commits/$GITHUB_SHA" -q '.parents[1].sha // empty' || true)
          if [ -n "$head" ]; then
            tree=$(gh api "$repo/git/commits/$GITHUB_SHA" -q .tree.sha || true)
            head_tree=$(gh api "$repo/git/commits/$head" -q .tree.sha || true)
            merged=$(gh api "$repo/commits/$GITHUB_SHA/pulls" -q "[.[] | select(.merge_commit_sha == \"$GITHUB_SHA\" and .base.ref == \"main\" and .head.sha == \"$head\")] | length" || true)
            passed=$(gh api "$repo/actions/workflows/ci.yml/runs?head_sha=$head&event=pull_request&status=success&per_page=1" -q .total_count || true)
            if [ -n "$tree" ] && [ "$tree" = "$head_tree" ] && [ "${merged:-0}" -ge 1 ] && [ "${passed:-0}" -ge 1 ]; then skip=true; fi
          fi
        fi
        echo "skip=$skip" >> "$GITHUB_OUTPUT"
        echo "Files already tested on their pull request: $skip"
