name: Release

on:
  # Normal path: a new version on main is released only after the full CI workflow passes.
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Create GitHub Release
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Check out verified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.19.0'
          registry-url: 'https://registry.npmjs.org'

      - name: Validate release metadata
        id: metadata
        env:
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          SHA="$VERIFIED_SHA"
          test "$(git rev-parse HEAD)" = "$SHA"

          VERSION=$(node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const packageJson = JSON.parse(readFileSync("package.json", "utf8"));
            const packageLock = JSON.parse(readFileSync("package-lock.json", "utf8"));
            if (packageJson.version !== packageLock.version || packageJson.version !== packageLock.packages?.[""]?.version) {
              throw new Error("package.json and package-lock.json versions do not match");
            }
            if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(packageJson.version)) {
              throw new Error(`Unsupported release version: ${packageJson.version}`);
            }
            process.stdout.write(packageJson.version);
          ')
          TAG="v${VERSION}"

          PREVIOUS_VERSION=$(git show HEAD^:package.json | node --input-type=module -e '
            import { readFileSync } from "node:fs";
            process.stdout.write(JSON.parse(readFileSync(0, "utf8")).version);
          ')
          if [[ "$PREVIOUS_VERSION" == "$VERSION" ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Package version is unchanged; no release is needed."
            exit 0
          fi

          node scripts/release-notes.ts CHANGELOG.md "$VERSION" > /tmp/release-notes.md
          test -s /tmp/release-notes.md

          PUBLISH_NPM=true
          if npm view "killeros@${VERSION}" version >/dev/null 2>&1; then
            PUBLISH_NPM=false
            echo "killeros@${VERSION} already exists on npm; skipping package publication."
          fi

          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "publish_npm=${PUBLISH_NPM}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Ensure npm trusted publishing support
        if: steps.metadata.outputs.publish_npm == 'true'
        run: npm install --global npm@11.5.1

      - name: Publish package to npm
        if: steps.metadata.outputs.publish_npm == 'true'
        run: npm publish

      - name: Create release
        if: steps.metadata.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.metadata.outputs.sha }}
          TAG: ${{ steps.metadata.outputs.tag }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; skipping."
            exit 0
          fi

          if git ls-remote --exit-code --refs origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            git fetch --no-tags origin "refs/tags/${TAG}:refs/tags/${TAG}"
            TAG_SHA=$(git rev-list -n 1 "$TAG")
            if [[ "$TAG_SHA" != "$SHA" ]]; then
              echo "Existing tag ${TAG} points to ${TAG_SHA}, not verified commit ${SHA}." >&2
              exit 1
            fi
          fi

          ARGS=(--target "$SHA" --notes-file /tmp/release-notes.md)
          if [[ "$VERSION" == *-* ]]; then
            ARGS+=(--prerelease)
          fi
          gh release create "$TAG" --title "$TAG" "${ARGS[@]}"
