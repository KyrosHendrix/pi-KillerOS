name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Release creation needs the contents scope; the default token is read-only.
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.19.0'

      - name: Extract changelog section
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if node scripts/release-notes.ts CHANGELOG.md "$VERSION" > /tmp/release-notes.md; then
            echo "notes=/tmp/release-notes.md" >> "$GITHUB_OUTPUT"
          else
            echo "notes=" >> "$GITHUB_OUTPUT"
            echo "::warning::CHANGELOG.md has no section for ${VERSION}; release notes will be generated from commits"
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES_PATH: ${{ steps.notes.outputs.notes }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.notes.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; skipping."
            exit 0
          fi
          ARGS=()
          if [[ "$VERSION" == *-* ]]; then
            ARGS+=(--prerelease)
          fi
          if [[ -n "$NOTES_PATH" ]]; then
            ARGS+=(--notes-file "$NOTES_PATH")
          else
            ARGS+=(--generate-notes)
          fi
          gh release create "$TAG" --title "$TAG" "${ARGS[@]}"
