name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

# Keep the default token read-only. Jobs that need an additional scope declare it locally.
permissions:
  contents: read

# Cancel obsolete runs for the same event ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CI: 'true'
  NPM_CONFIG_FUND: 'false'

jobs:
  quality:
    name: Quality (Node ${{ matrix.node-version }})
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Exercise the declared floor and the current LTS line. lts/* advances with Node releases.
        node-version:
          - '22.19.0'
          - 'lts/*'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Type-check
        run: npm run check

      - name: Validate release metadata
        if: matrix.node-version == '22.19.0'
        env:
          KILLEROS_RELEASE: 'true'
        run: node --experimental-strip-types scripts/verify-release.ts

      - name: Provision publishing npm
        if: matrix.node-version == '22.19.0'
        run: npm install --prefix "$RUNNER_TEMP/killeros-publishing-npm" --ignore-scripts --no-audit --no-fund --no-package-lock --no-save npm@11.5.1

      - name: Test publication lifecycle with publishing npm
        if: matrix.node-version == '22.19.0'
        env:
          KILLEROS_TEST_NPM_CLI: ${{ runner.temp }}/killeros-publishing-npm/node_modules/npm/bin/npm-cli.js
        run: node --test --test-force-exit --experimental-strip-types --test-name-pattern="publication lifecycle" test/verify-release.test.ts

      - name: Repeat Pi startup lifecycle without forced exit
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            echo "Pi startup lifecycle run $attempt/5"
            node --test --experimental-strip-types test/PiStartup.test.ts || exit $?
          done

      - name: Repeat installed CLI pilot without forced exit
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            echo "Installed CLI pilot run $attempt/5"
            node --test --experimental-strip-types --test-name-pattern="installed Pi CLI completes a goal and restores it without unsolicited model work" test/PiExtensionContract.test.ts || exit $?
          done

      - name: Test terminal pilot and fault controls without forced exit
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            echo "Terminal pilot and fault controls run $attempt/5"
            node --test --experimental-strip-types --test-name-pattern="installed Pi terminal|terminal driver reports|RPC driver controls" test/PiExtensionContract.test.ts test/PiTerminalControls.test.ts test/PiRpcControls.test.ts || exit $?
          done

      - name: Test
        run: npm test

      - name: Upload test failure reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: test-failures-quality-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: node_modules/.killeros-*/failure.txt
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  windows:
    name: Windows (Node ${{ matrix.node-version }})
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - '22.19.0'
          - 'lts/*'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Check
        run: npm run check

      - name: Repeat Pi startup lifecycle without forced exit
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            echo "Pi startup lifecycle run $attempt/5"
            node --test --experimental-strip-types test/PiStartup.test.ts || exit $?
          done

      - name: Repeat installed CLI pilot without forced exit
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            echo "Installed CLI pilot run $attempt/5"
            node --test --experimental-strip-types --test-name-pattern="installed Pi CLI completes a goal and restores it without unsolicited model work" test/PiExtensionContract.test.ts || exit $?
          done

      - name: Test terminal pilot and fault controls without forced exit
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            echo "Terminal pilot and fault controls run $attempt/5"
            node --test --experimental-strip-types --test-name-pattern="installed Pi terminal|terminal driver reports|RPC driver controls" test/PiExtensionContract.test.ts test/PiTerminalControls.test.ts test/PiRpcControls.test.ts || exit $?
          done

      - name: Test
        run: npm test

      - name: Upload test failure reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: test-failures-windows-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: node_modules/.killeros-*/failure.txt
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  pi-latest:
    name: Pi compatibility (${{ matrix.pi-channel }})
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Keep required-check names stable when the supported Pi versions change.
        include:
          - pi-channel: minimum
            pi-target: '1.3.0'
          - pi-channel: latest
            pi-target: '>=1.3.0 <2'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.19.0'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install matched Pi packages
        env:
          PI_TARGET: ${{ matrix.pi-target }}
        run: |
          PI_VERSION=$(npm view "@earendil-works/pi-coding-agent@$PI_TARGET" version --json | node -e 'const value=JSON.parse(require("node:fs").readFileSync(0)); console.log(Array.isArray(value) ? value.at(-1) : value)')
          PI_AI_RANGE=$(npm view "@earendil-works/pi-coding-agent@$PI_VERSION" dependencies.@earendil-works/pi-ai)
          PI_TUI_RANGE=$(npm view "@earendil-works/pi-coding-agent@$PI_VERSION" dependencies.@earendil-works/pi-tui)
          PI_TYPEBOX_RANGE=$(npm view "@earendil-works/pi-coding-agent@$PI_VERSION" dependencies.typebox)
          test -n "$PI_AI_RANGE" && test -n "$PI_TUI_RANGE" && test -n "$PI_TYPEBOX_RANGE"
          npm install --ignore-scripts --no-audit --no-fund --no-save --package-lock=false \
            "@earendil-works/pi-ai@$PI_AI_RANGE" \
            "@earendil-works/pi-coding-agent@$PI_VERSION" \
            "@earendil-works/pi-tui@$PI_TUI_RANGE" \
            "typebox@$PI_TYPEBOX_RANGE"

      - name: Verify package files are unchanged
        run: git diff --exit-code -- package.json package-lock.json

      - name: Type-check against matched Pi
        run: npm run check

      - name: Repeat Pi startup lifecycle without forced exit
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            echo "Pi startup lifecycle run $attempt/5"
            node --test --experimental-strip-types test/PiStartup.test.ts || exit $?
          done

      - name: Repeat installed CLI pilot without forced exit
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            echo "Installed CLI pilot run $attempt/5"
            node --test --experimental-strip-types --test-name-pattern="installed Pi CLI completes a goal and restores it without unsolicited model work" test/PiExtensionContract.test.ts || exit $?
          done

      - name: Test terminal pilot and fault controls without forced exit
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            echo "Terminal pilot and fault controls run $attempt/5"
            node --test --experimental-strip-types --test-name-pattern="installed Pi terminal|terminal driver reports|RPC driver controls" test/PiExtensionContract.test.ts test/PiTerminalControls.test.ts test/PiRpcControls.test.ts || exit $?
          done

      - name: Test Pi cancellation lifecycle without forced exit
        if: matrix.pi-channel == 'latest'
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            echo "Pi cancellation lifecycle run $attempt/5"
            node --test --experimental-strip-types --test-name-pattern="Pi user cancellation stops goal work after a normal result, during retry, and during pending compaction" test/PiExtensionContract.test.ts || exit $?
          done

      - name: Repeat saved tool restoration without forced exit
        run: |
          for attempt in 1 2 3 4 5; do
            echo "Saved tool restoration run $attempt/5"
            node --test --experimental-strip-types test/PiToolRestoration.e2e.test.ts || exit $?
          done

      - name: Test against matched Pi
        run: npm test

      - name: Upload test failure reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: test-failures-pi-${{ matrix.pi-channel }}-${{ github.run_attempt }}
          path: node_modules/.killeros-*/failure.txt
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  package:
    name: Package smoke test
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.19.0'

      - name: Validate release metadata
        env:
          KILLEROS_RELEASE: 'true'
        run: node --experimental-strip-types scripts/verify-release.ts

      - name: Validate publish contents
        run: |
          npm pack --dry-run --ignore-scripts --json > pack.json
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const parsed = JSON.parse(readFileSync("pack.json", "utf8"));
            const pack = Array.isArray(parsed) ? parsed[0] : Object.values(parsed)[0];
            if (!pack || typeof pack !== "object") throw new Error("npm pack returned no package metadata");
            const files = new Set(pack.files.map(({ path }) => path));
            const required = ["Killeros.ts", "README.md", "CHANGELOG.md", "themes/killeros.json"];
            const missing = required.filter((file) => !files.has(file));
            if (missing.length) throw new Error(`Package is missing: ${missing.join(", ")}`);
            if (pack.id !== `killeros@${JSON.parse(readFileSync("package.json", "utf8")).version}`) throw new Error(`Unexpected package id: ${pack.id}`);
          '

  audit:
    name: Dependency audit
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.19.0'

      - name: Audit locked dependencies
        run: npm audit --audit-level=moderate --package-lock-only --ignore-scripts --no-fund

  dependency-review:
    name: Dependency review
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-scopes: runtime,development,unknown
          fail-on-severity: moderate

  codeql:
    name: CodeQL
    # Fork PRs use a read-only token and cannot upload code-scanning results.
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          build-mode: none
          languages: javascript-typescript

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          category: /language:javascript-typescript
