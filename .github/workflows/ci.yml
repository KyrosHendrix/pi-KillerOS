name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

# Keep the default token read-only. Jobs that need an additional scope declare it locally.
permissions:
  actions: read
  contents: read
  pull-requests: read

# Cancel obsolete runs for the same event ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CI: 'true'
  NPM_CONFIG_FUND: 'false'

jobs:
  tested-tree:
    name: Check for a tested tree
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.tested.outputs.skip }}
    steps:
      - name: Check out merge and parents
        id: checkout
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Check the pull request's recorded tree
        id: tested
        if: steps.checkout.outcome == 'success'
        continue-on-error: true
        uses: ./.github/actions/tested-tree

  quality-checks:
    name: Quality checks
    needs: tested-tree
    if: "!cancelled() && (needs.tested-tree.result != 'success' || needs.tested-tree.outputs.skip != 'true')"
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.13.0'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Audit locked dependencies
        run: npm audit --audit-level=moderate --package-lock-only --ignore-scripts --no-fund

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Type-check
        run: npm run check

      - name: Validate release metadata
        env:
          KILLEROS_RELEASE: 'true'
        run: node --experimental-strip-types scripts/verify-release.ts

      - name: Provision publishing npm
        run: npm install --prefix "$RUNNER_TEMP/killeros-publishing-npm" --ignore-scripts --no-audit --no-fund --no-package-lock --no-save npm@11.5.1

      - name: Test publication lifecycle with publishing npm
        env:
          KILLEROS_TEST_NPM_CLI: ${{ runner.temp }}/killeros-publishing-npm/node_modules/npm/bin/npm-cli.js
        run: node --test --test-force-exit --experimental-strip-types --test-name-pattern="publication lifecycle" test/verify-release.test.ts

      - name: Record the checked-out PR tree
        id: tree
        if: github.event_name == 'pull_request' && github.base_ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        run: |
          tree=$(git rev-parse --verify 'HEAD^{tree}')
          echo "sha=$tree" >> "$GITHUB_OUTPUT"
          echo "$tree" > "$RUNNER_TEMP/tested-tree.txt"

      - name: Publish the checked-out PR tree
        if: steps.tree.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tested-tree-${{ github.event.pull_request.number }}-${{ github.run_attempt }}-${{ steps.tree.outputs.sha }}
          path: ${{ runner.temp }}/tested-tree.txt
          if-no-files-found: error
          retention-days: 7

      - name: Upload test failure reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: test-failures-quality-checks-${{ github.run_attempt }}
          path: node_modules/.killeros-*/failure.txt
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  quality-tests:
    name: Quality tests (${{ matrix.shard }}/6)
    needs: tested-tree
    if: "!cancelled() && (needs.tested-tree.result != 'success' || needs.tested-tree.outputs.skip != 'true')"
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.13.0'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Test shard
        run: node --experimental-strip-types scripts/test-suite.ts --shard ${{ matrix.shard }}/6 --concurrency 2 --lifecycle-repeats 2

      - name: Upload test failure reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: test-failures-quality-${{ matrix.shard }}-${{ github.run_attempt }}
          path: node_modules/.killeros-*/failure.txt
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  pi-latest:
    name: Pi compatibility (latest)
    needs: tested-tree
    if: "!cancelled() && (needs.tested-tree.result != 'success' || needs.tested-tree.outputs.skip != 'true')"
    runs-on: windows-latest
    timeout-minutes: 25
    outputs:
      full-suite: ${{ steps.pi.outputs.full-suite }}
      packages: ${{ steps.pi.outputs.packages }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.13.0'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install matched Pi packages
        id: pi
        env:
          PI_TARGET: '>=1.5.2 <2'
        run: |
          PI_VERSION=$(npm view "@earendil-works/pi-coding-agent@$PI_TARGET" version --json | node -e 'const value=JSON.parse(require("node:fs").readFileSync(0)); console.log(Array.isArray(value) ? value.at(-1) : value)')
          PI_AI_RANGE=$(npm view "@earendil-works/pi-coding-agent@$PI_VERSION" dependencies.@earendil-works/pi-ai)
          PI_TUI_RANGE=$(npm view "@earendil-works/pi-coding-agent@$PI_VERSION" dependencies.@earendil-works/pi-tui)
          PI_TYPEBOX_RANGE=$(npm view "@earendil-works/pi-coding-agent@$PI_VERSION" dependencies.typebox)
          test -n "$PI_AI_RANGE" && test -n "$PI_TUI_RANGE" && test -n "$PI_TYPEBOX_RANGE"
          npm install --ignore-scripts --no-audit --no-fund --no-save --package-lock=false \
            "@earendil-works/pi-ai@$PI_AI_RANGE" \
            "@earendil-works/pi-coding-agent@$PI_VERSION" \
            "@earendil-works/pi-tui@$PI_TUI_RANGE" \
            "typebox@$PI_TYPEBOX_RANGE"
          node -e '
            const { appendFileSync, readFileSync } = require("node:fs");
            const locked = JSON.parse(readFileSync("package-lock.json", "utf8")).packages;
            const names = ["@earendil-works/pi-ai", "@earendil-works/pi-coding-agent", "@earendil-works/pi-tui", "typebox"];
            const installed = (name) => JSON.parse(readFileSync("node_modules/" + name + "/package.json", "utf8")).version;
            const fullSuite = names.some((name) => installed(name) !== locked["node_modules/" + name]?.version);
            const packages = names.map((name) => name + "@" + installed(name)).join(" ");
            console.log("Installed " + packages + "; repeat runtime suites: " + fullSuite);
            appendFileSync(process.env.GITHUB_OUTPUT, "full-suite=" + fullSuite + "\npackages=" + packages + "\n");
          '

      - name: Verify package files are unchanged
        run: git diff --exit-code -- package.json package-lock.json

      - name: Type-check against matched Pi
        run: npm run check

  pi-latest-tests:
    name: Pi compatibility (latest) tests (${{ matrix.shard }}/6)
    needs: pi-latest
    if: needs.pi-latest.outputs.full-suite == 'true'
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.13.0'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install matched Pi packages
        env:
          PI_PACKAGES: ${{ needs.pi-latest.outputs.packages }}
        run: |
          read -ra packages <<< "$PI_PACKAGES"
          test "${#packages[@]}" -eq 4
          npm install --ignore-scripts --no-audit --no-fund --no-save --package-lock=false "${packages[@]}"

      - name: Verify package files are unchanged
        run: git diff --exit-code -- package.json package-lock.json

      - name: Test shard against matched Pi
        run: node --experimental-strip-types scripts/test-suite.ts --shard ${{ matrix.shard }}/6 --concurrency 2 --lifecycle-repeats 2

      - name: Upload test failure reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: test-failures-pi-latest-${{ matrix.shard }}-${{ github.run_attempt }}
          path: node_modules/.killeros-*/failure.txt
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  quality:
    name: Quality
    needs: [tested-tree, quality-checks, quality-tests, pi-latest, pi-latest-tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every quality job
        env:
          REUSE: ${{ needs.tested-tree.result == 'success' && needs.tested-tree.outputs.skip == 'true' }}
          CHECKS: ${{ needs.quality-checks.result }}
          TESTS: ${{ needs.quality-tests.result }}
          LATEST: ${{ needs.pi-latest.result }}
          FULL_SUITE: ${{ needs.pi-latest.outputs.full-suite }}
          SHARDS: ${{ needs.pi-latest-tests.result }}
        run: |
          if [ "$REUSE" = true ]; then
            test "$CHECKS" = skipped
            test "$TESTS" = skipped
            test "$LATEST" = skipped
            test "$SHARDS" = skipped
          else
            test "$CHECKS" = success
            test "$TESTS" = success
            test "$LATEST" = success
            case "$FULL_SUITE" in
              true) test "$SHARDS" = success ;;
              false) test "$SHARDS" = skipped ;;
              *) exit 1 ;;
            esac
          fi

  codeql:
    name: CodeQL
    # Fork PRs use a read-only token and cannot upload code-scanning results.
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          build-mode: none
          languages: javascript-typescript

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          category: /language:javascript-typescript
