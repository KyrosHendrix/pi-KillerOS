name: CI

on:
  push:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

# Keep the default token read-only. Jobs that need an additional scope declare it locally.
permissions:
  contents: read

# A pull request and its branch push share a group, so obsolete runs are cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  NPM_CONFIG_FUND: 'false'

jobs:
  quality:
    name: Quality (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Exercise the declared floor and the current LTS line. lts/* advances with Node releases.
        node-version:
          - '22.19.0'
          - 'lts/*'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Type-check
        run: npm run check

      - name: Test
        run: npm test

  pi-latest:
    name: Pi latest compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.19.0'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install latest matched Pi packages
        run: |
          PI_VERSION=$(npm view @earendil-works/pi-coding-agent version)
          PI_AI_RANGE=$(npm view "@earendil-works/pi-coding-agent@$PI_VERSION" dependencies.@earendil-works/pi-ai)
          PI_TUI_RANGE=$(npm view "@earendil-works/pi-coding-agent@$PI_VERSION" dependencies.@earendil-works/pi-tui)
          test -n "$PI_AI_RANGE" && test -n "$PI_TUI_RANGE"
          npm install --ignore-scripts --no-audit --no-fund --no-save --package-lock=false \
            "@earendil-works/pi-ai@$PI_AI_RANGE" \
            "@earendil-works/pi-coding-agent@$PI_VERSION" \
            "@earendil-works/pi-tui@$PI_TUI_RANGE"

      - name: Type-check against latest Pi
        run: npm run check

      - name: Test against latest Pi
        run: npm test

  package:
    name: Package smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.19.0'

      - name: Validate publish contents
        run: |
          npm pack --dry-run --ignore-scripts --json > pack.json
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const parsed = JSON.parse(readFileSync("pack.json", "utf8"));
            const pack = Array.isArray(parsed) ? parsed[0] : Object.values(parsed)[0];
            if (!pack || typeof pack !== "object") throw new Error("npm pack returned no package metadata");
            const files = new Set(pack.files.map(({ path }) => path));
            const required = ["Killeros.ts", "README.md", "CHANGELOG.md", "themes/killeros.json"];
            const missing = required.filter((file) => !files.has(file));
            if (missing.length) throw new Error(`Package is missing: ${missing.join(", ")}`);
            if (pack.id !== `killeros@${JSON.parse(readFileSync("package.json", "utf8")).version}`) throw new Error(`Unexpected package id: ${pack.id}`);
          '

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.19.0'

      - name: Audit locked dependencies
        run: npm audit --audit-level=high --package-lock-only --ignore-scripts --no-fund

  dependency-review:
    name: Dependency review
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-scopes: runtime,development,unknown
          fail-on-severity: high

  codeql:
    name: CodeQL
    # Fork PRs use a read-only token and cannot upload code-scanning results.
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          build-mode: none
          languages: javascript-typescript

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          category: /language:javascript-typescript
